# Produção na VM do Azure. Usado pelo CD (.github/workflows/cd.yml), que define GHCR_OWNER e IMAGE_TAG
# (o SHA do commit publicado pelo CI). Segredos e URLs ficam em /srv/factcheck/.env, só na VM.
services:
  judge-service:
    image: ghcr.io/${GHCR_OWNER:?defina GHCR_OWNER}/factcheck-judge:${IMAGE_TAG:?defina IMAGE_TAG}
    env_file: /srv/factcheck/.env
    environment:
      GIT_SHA: ${IMAGE_TAG}
    restart: unless-stopped
    # Sem `ports`: o judge só é acessível pelo router, dentro da rede do compose.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  router-service:
    image: ghcr.io/${GHCR_OWNER:?defina GHCR_OWNER}/factcheck-router:${IMAGE_TAG:?defina IMAGE_TAG}
    env_file: /srv/factcheck/.env
    environment:
      GIT_SHA: ${IMAGE_TAG}
      JUDGE_SERVICE_URL: http://judge-service:8000
    depends_on:
      judge-service:
        condition: service_healthy
    volumes:
      # Parquets gerados na VM pelo pipeline de ingestão; a imagem não os contém.
      - /srv/factcheck/data/processed:/app/data/processed:ro
    # Sem `ports`: o router só é alcançável pelo frontend (nginx) dentro da rede do compose.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    image: ghcr.io/${GHCR_OWNER:?defina GHCR_OWNER}/factcheck-frontend:${IMAGE_TAG:?defina IMAGE_TAG}
    depends_on:
      router-service:
        condition: service_healthy
    # Sem `ports`: quem aparece na internet é o Caddy, que termina o HTTPS e encaminha para cá.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    # HTTPS de polis.software (DNS no name.com apontando para o IP da VM; NSG com 80 e 443 abertas).
    image: caddy:2.8.4
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/factcheck/Caddyfile.site:/etc/caddy/Caddyfile:ro
      # Certificados e conta ACME: sem este volume, cada deploy pediria um certificado novo.
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:

# Rede criada uma vez na VM, com sub-rede fixa:
#   docker network create --subnet 172.28.0.0/24 --gateway 172.28.0.1 factcheck
# O túnel SSH do Ollama escuta no gateway (172.28.0.1:11434), alcançável só por estes containers.
networks:
  default:
    name: factcheck
    external: true
