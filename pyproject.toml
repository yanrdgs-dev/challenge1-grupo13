[project]
name = "factcheck-agent"
version = "0.1.0"
description = "Agente de fact-checking político brasileiro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "rapidfuzz>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "nemoguardrails>=0.17.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.0",
    "mkdocs-awesome-pages-plugin>=2.9.0",
    "mkdocs-material>=9.5.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]
eda = [
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[tool.uv]
package = false

[tool.pyrefly]
search-path = ["."]
python-interpreter-path = ".venv/bin/python"

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
