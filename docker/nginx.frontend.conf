# nginx do frontend: serve o build do Vite e encaminha /api para o router (rede do compose).
# Cada checagem ocupa o Ollama local por dezenas de segundos: as rotas de checagem têm limite por cliente.

limit_req_zone $binary_remote_addr zone=checks:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    # O nome do router é resolvido a cada request (DNS do Docker): o nginx sobe mesmo sem o router de pé.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $router http://router-service:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Streaming SSE: sem buffer (o veredito aparece à medida que sai) e com tempo para o Ollama local.
    location /api/check/stream {
        limit_req zone=checks burst=5 nodelay;
        proxy_pass $router;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    location /api/check {
        limit_req zone=checks burst=5 nodelay;
        proxy_pass $router;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass $router;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Arquivos com hash no nome nunca mudam: cache longo. (add_header em location substitui os do
    # server, então os cabeçalhos de segurança são repetidos aqui.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Casca da SPA: nunca em cache, para o navegador sempre achar o build novo.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
