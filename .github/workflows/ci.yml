name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Testes unitários rodam sem rede e sem Langfuse (regra 8).
  LANGFUSE_TRACING_ENABLED: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instala as dependências (versões do uv.lock)
        run: uv sync --frozen
      - name: Testes unitários
        run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [router, judge, frontend]
    env:
      # PR vindo de fork não recebe permissão de escrita no GHCR: só valida o build.
      PUSH: ${{ github.event.pull_request.head.repo.fork != true }}
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem (o GHCR exige minúsculas)
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/factcheck-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e carrega a imagem localmente (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          load: true
          push: false
          tags: factcheck-${{ matrix.service }}:smoke
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Smoke test - o módulo do serviço importa dentro da imagem
        if: matrix.service != 'frontend'
        # Pega o que os testes não pegam: código que só funciona com o repositório inteiro ao lado
        # (ex.: `from scripts...` dentro de src/). Sem volume: vale só para o conteúdo da imagem.
        run: |
          docker run --rm --entrypoint python -e LANGFUSE_TRACING_ENABLED=false \
            factcheck-${{ matrix.service }}:smoke \
            -c "import src.services.${{ matrix.service }}_service"
      - name: Smoke test - nginx aceita a configuração da imagem
        if: matrix.service == 'frontend'
        run: docker run --rm --entrypoint nginx factcheck-frontend:smoke -t
      - name: Push com a tag do commit (quando permitido)
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
