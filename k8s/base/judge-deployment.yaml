apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge-deployment
  labels:
    app: judge-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: judge-service
  template:
    metadata:
      labels:
        app: judge-service
    spec:
      # Cobre o preStop (5s) + o flush do Langfuse no shutdown do FastAPI.
      terminationGracePeriodSeconds: 30
      containers:
        - name: judge-agent
          image: factcheck-judge
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              # Dá tempo de o pod sair do balanceamento antes do SIGTERM; o flush
              # dos traces acontece no shutdown do serviço.
              exec:
                command: ["sleep", "5"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: factcheck-config
            # Chaves do Langfuse. Opcional: sem o Secret, os pods sobem com tracing desligado.
            - secretRef:
                name: factcheck-langfuse
                optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: judge-service
  labels:
    app: judge-service
spec:
  type: ClusterIP
  selector:
    app: judge-service
  ports:
    - port: 8000
      targetPort: 8000
      name: http
