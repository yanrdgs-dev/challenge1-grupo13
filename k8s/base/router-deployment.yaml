apiVersion: apps/v1
kind: Deployment
metadata:
  name: router-deployment
  labels:
    app: router-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: router-service
  template:
    metadata:
      labels:
        app: router-service
    spec:
      containers:
        - name: router-agent
          image: factcheck-router
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: factcheck-config
            # Chaves do Langfuse. Opcional: sem o Secret, os pods sobem com tracing desligado.
            - secretRef:
                name: factcheck-langfuse
                optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: router-service
  labels:
    app: router-service
spec:
  type: LoadBalancer
  selector:
    app: router-service
  ports:
    - port: 8000
      targetPort: 8000
      name: http
