# Modelo do Secret com as chaves do Langfuse Cloud. NÃO é aplicado pelo Kustomize.
# Crie o Secret real direto no cluster, sem salvar as chaves em arquivo:
#
#   kubectl create secret generic factcheck-langfuse \
#     --from-literal=LANGFUSE_PUBLIC_KEY='pk-lf-...' \
#     --from-literal=LANGFUSE_SECRET_KEY='sk-lf-...'
#
# As chaves ficam em Langfuse > Settings > API Keys do projeto.
apiVersion: v1
kind: Secret
metadata:
  name: factcheck-langfuse
type: Opaque
stringData:
  LANGFUSE_PUBLIC_KEY: "<pk-lf-...>"
  LANGFUSE_SECRET_KEY: "<sk-lf-...>"
