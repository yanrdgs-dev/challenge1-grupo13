apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge-deployment
  labels:
    app: judge-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: judge-service
  template:
    metadata:
      labels:
        app: judge-service
    spec:
      containers:
        - name: judge-agent
          image: factcheck-judge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: factcheck-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: judge-service
  labels:
    app: judge-service
spec:
  type: ClusterIP
  selector:
    app: judge-service
  ports:
    - port: 8000
      targetPort: 8000
      name: http
